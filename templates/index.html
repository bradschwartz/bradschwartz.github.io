{% extends "base.html" %}

{% block content %}
{{ section.content | safe }}

<h2>Posts</h2>
<ul>
  {% set blog = get_section(path="blog/_index.md") %}
  {% for post in blog.pages %}
  <li><a href="{{ post.permalink | safe }}">{{ post.title }}</a> <span class="post-date">({{ post.date }})</span></li>
  {% endfor %}
</ul>
{% endblock content %}
